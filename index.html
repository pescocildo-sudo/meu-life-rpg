<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SYSTEM - CUSTOM ENGINE</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&family=Space+Grotesk:wght@500;700&display=swap');

        :root {
            --bg: #0d0f14;
            --panel: rgba(26, 30, 41, 0.85);
            --primary: #00f3ff;
            --secondary: #7000ff;
            --text: #f0f4f8;
            --success: #00ffa3;
            --danger: #ff4d4d;
            --gray: #94a3b8;
            --overlay: rgba(0,0,0,0.4);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }

        body { 
            font-family: 'Outfit', sans-serif; 
            background-color: var(--bg);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text); 
            margin: 0; padding: 0; overflow: hidden; height: 100vh;
            transition: background 0.5s ease;
        }

        /* Overlay para legibilidade do fundo */
        .bg-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--overlay); z-index: -1;
        }

        .app-container { display: flex; flex-direction: column; height: 100vh; max-width: 500px; margin: 0 auto; }
        .main-content { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 120px; position: relative; }

        /* ANIMAÇÃO DE VITÓRIA */
        @keyframes victoryFlash {
            0% { box-shadow: 0 0 0px var(--primary); }
            50% { box-shadow: 0 0 50px var(--primary); background: var(--primary); }
            100% { box-shadow: 0 0 0px var(--primary); }
        }
        .victory-active { animation: victoryFlash 0.5s ease-out; }

        /* ESTILO DOS MENUS */
        .view-title { font-family: 'Space Grotesk', sans-serif; font-size: 1.8rem; margin: 10px 0 20px 0; font-weight: 700; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        .tab-content { display: none; animation: fadeIn 0.3s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* NAV BAR */
        .nav-bar {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 400px; height: 75px;
            background: rgba(26, 30, 41, 0.9); backdrop-filter: blur(15px);
            display: flex; justify-content: space-around; align-items: center;
            border-radius: 25px; border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6); z-index: 1000;
        }
        .nav-item { background: none; border: none; color: var(--gray); display: flex; flex-direction: column; align-items: center; cursor: pointer; flex: 1; }
        .nav-item.active { color: var(--primary); text-shadow: 0 0 10px var(--primary); }
        .nav-item span { font-size: 24px; }

        /* STATUS CIRCLE */
        .progress-center { position: relative; width: 180px; height: 180px; margin: 20px auto; display: flex; justify-content: center; align-items: center; }
        .pie-chart { width: 100%; height: 100%; border-radius: 50%; background: conic-gradient(var(--primary) 0deg, rgba(255,255,255,0.1) 0deg); transition: 0.5s; }
        .pie-inner { position: absolute; width: 155px; height: 155px; background: var(--panel); backdrop-filter: blur(5px); border-radius: 50%; display: flex; flex-direction: column; justify-content: center; align-items: center; }

        /* UI ELEMENTS */
        .card { background: var(--panel); backdrop-filter: blur(10px); padding: 22px; border-radius: 24px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.05); }
        .btn-main { width: 100%; min-height: 60px; border-radius: 18px; border: none; background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #fff; font-size: 1rem; font-weight: 700; cursor: pointer; font-family: 'Space Grotesk', sans-serif; transition: 0.2s; }
        .btn-main:active { transform: scale(0.95); }
        
        input, textarea, select { width: 100%; padding: 15px; background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.1); color: #fff; border-radius: 15px; font-size: 1rem; margin-bottom: 15px; font-family: inherit; }

        /* TEMA PRESETS */
        .theme-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 15px; }
        .theme-btn { height: 40px; border-radius: 10px; border: 2px solid transparent; cursor: pointer; }
    </style>
</head>
<body id="body-bg">

<div class="bg-overlay"></div>

<div class="app-container" id="app-main">
    <div class="main-content">
        
        <div id="tab-status" class="tab-content active">
            <h1 class="view-title">Dashboard</h1>
            <div class="progress-center">
                <div class="pie-chart" id="pie-chart"></div>
                <div class="pie-inner">
                    <span style="font-size:0.7rem; color:var(--primary); font-weight:700" id="rank-txt">RECRUTA</span>
                    <span style="font-size:3.5rem; font-weight:700; line-height:1" id="lvl-txt">1</span>
                    <span style="font-size:0.8rem; color:var(--gray)" id="xp-txt">0/200 XP</span>
                </div>
            </div>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px;">
                <div class="card" style="text-align:center">
                    <div style="color:var(--primary); font-size:1.5rem; font-weight:700" id="stat-xp">0</div>
                    <div style="font-size:0.6rem; color:var(--gray)">XP TOTAL</div>
                </div>
                <div class="card" style="text-align:center">
                    <div style="color:var(--success); font-size:1.5rem; font-weight:700" id="stat-streak">0</div>
                    <div style="font-size:0.6rem; color:var(--gray)">STREAK</div>
                </div>
            </div>
        </div>

        <div id="tab-apex" class="tab-content">
            <h1 class="view-title">Objetivo Apex</h1>
            <div id="apex-setup" class="card">
                <input type="text" id="apex-input" placeholder="Defina sua prioridade...">
                <button class="btn-main" onclick="setApex()">ESTABELECER FOCO</button>
            </div>
            <div id="apex-active" class="card" style="display:none; text-align:center;">
                <div style="font-size:0.7rem; color:var(--primary); letter-spacing:3px">MISSÃO ATIVA</div>
                <div style="font-size:1.6rem; font-weight:700; margin:20px 0" id="apex-display">---</div>
                <button class="btn-main" id="btn-complete-apex" onclick="completeApex()">CONCLUIR (+100 XP)</button>
                <button style="background:none; border:none; color:var(--gray); margin-top:15px; font-size:0.8rem" onclick="cancelApex()">REDEFINIR</button>
            </div>
            <div id="apex-done" class="card" style="display:none; text-align:center">
                <div style="font-size:3rem">⭐</div>
                <h3>DOMÍNIO COMPLETO</h3>
                <p style="color:var(--gray)">Objetivo concluído com sucesso.</p>
            </div>
        </div>

        <div id="tab-side" class="tab-content">
            <h1 class="view-title">Side Quests</h1>
            <input type="text" id="side-input" placeholder="Nova tarefa...">
            <button class="btn-main" style="min-height:45px; background:var(--panel); border:1px solid var(--primary); color:var(--primary)" onclick="addSide()">+ ADICIONAR</button>
            <div id="side-list" style="margin-top:20px"></div>
        </div>

        <div id="tab-log" class="tab-content">
            <h1 class="view-title">Relatório</h1>
            <textarea id="log-input" rows="3" placeholder="O que conquistou hoje?"></textarea>
            <button class="btn-main" onclick="addLog()">SALVAR LOG</button>
            <div id="log-list" style="margin-top:20px"></div>
        </div>

        <div id="tab-sys" class="tab-content">
            <h1 class="view-title">Configurações</h1>
            <div class="card">
                <h3>Personalizar Fundo</h3>
                <div class="theme-grid">
                    <div class="theme-btn" style="background:#0d0f14; border-color:#fff" onclick="setTheme('none')"></div>
                    <div class="theme-btn" style="background:url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=100')" onclick="setTheme('https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=1000')"></div>
                    <div class="theme-btn" style="background:url('https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=100')" onclick="setTheme('https://images.unsplash.com/photo-1441974231531-c6227db76b6e?q=80&w=1000')"></div>
                    <div class="theme-btn" style="background:url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=100')" onclick="setTheme('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1000')"></div>
                </div>
                <input type="text" id="custom-bg-input" placeholder="Link da imagem (URL)">
                <button class="btn-main" style="min-height:40px; font-size:0.8rem" onclick="setTheme(document.getElementById('custom-bg-input').value)">APLICAR FUNDO</button>
            </div>

            <div class="card">
                <button class="btn-main" style="background:var(--success); color:#000; margin-bottom:10px" onclick="exportData()">EXPORTAR PROGRESSO</button>
                <button class="btn-main" style="background:var(--gray)" onclick="document.getElementById('f-in').click()">IMPORTAR PROGRESSO</button>
                <input type="file" id="f-in" style="display:none" onchange="importData(event)">
            </div>
            <button class="btn-main" style="background:none; color:var(--danger); border:1px solid var(--danger)" onclick="resetAll()">RESET TOTAL</button>
        </div>

    </div>

    <nav class="nav-bar">
        <button class="nav-item active" onclick="nav('tab-status', this)"><span>📊</span></button>
        <button class="nav-item" onclick="nav('tab-apex', this)"><span>⭐</span></button>
        <button class="nav-item" onclick="nav('tab-side', this)"><span>⚔️</span></button>
        <button class="nav-item" onclick="nav('tab-log', this)"><span>📜</span></button>
        <button class="nav-item" onclick="nav('tab-sys', this)"><span>⚙️</span></button>
    </nav>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('custom_rpg_v20')) || {
        xp: 0, lvl: 1, streak: 0,
        apexTask: "", apexStatus: "setup", lastReset: "",
        sideQuests: [], logs: [], theme: "none"
    };

    const audio = new (window.AudioContext || window.webkitAudioContext)();
    function sound(freq, type='sine', dur=0.2, vol=0.1) {
        const o = audio.createOscillator(); const g = audio.createGain();
        o.type = type; o.frequency.value = freq;
        g.gain.setValueAtTime(vol, audio.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, audio.currentTime + dur);
        o.connect(g); g.connect(audio.destination); o.start(); o.stop(audio.currentTime + dur);
    }

    function nav(id, btn) {
        sound(400, 'triangle', 0.1, 0.05);
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        btn.classList.add('active');
        render();
    }

    // --- APEX ---
    function setApex() {
        const v = document.getElementById('apex-input').value;
        if(!v) return;
        db.apexTask = v.toUpperCase(); db.apexStatus = "active";
        save(); render(); sound(600, 'square');
    }

    function completeApex() {
        const el = document.getElementById('app-main');
        el.classList.add('victory-active');
        setTimeout(() => el.classList.remove('victory-active'), 500);
        
        db.apexStatus = "done"; db.lastReset = new Date().toLocaleDateString();
        db.streak++; addXP(100);
        sound(800, 'square', 0.5, 0.2); sound(1200, 'square', 0.6, 0.1);
    }

    function cancelApex() {
        if(confirm("Mudar objetivo?")) { db.apexStatus = "setup"; db.apexTask = ""; save(); render(); }
    }

    // --- SYSTEM ---
    function setTheme(url) {
        db.theme = url;
        document.body.style.backgroundImage = url === 'none' ? 'none' : `url('${url}')`;
        save();
    }

    function addXP(amount) {
        db.xp += amount; db.lvl = Math.floor(db.xp / 200) + 1;
        save(); render(); sound(1000, 'sine', 0.3);
    }

    function render() {
        const xpInLvl = db.xp % 200;
        const deg = (xpInLvl / 200) * 360;
        document.getElementById('lvl-txt').innerText = db.lvl;
        document.getElementById('stat-xp').innerText = db.xp;
        document.getElementById('stat-streak').innerText = db.streak;
        document.getElementById('xp-txt').innerText = `${xpInLvl}/200 XP`;
        document.getElementById('pie-chart').style.background = `conic-gradient(var(--primary) ${deg}deg, rgba(255,255,255,0.1) 0deg)`;
        
        const today = new Date().toLocaleDateString();
        if(db.lastReset !== today && db.apexStatus === "done") { db.apexStatus = "setup"; db.apexTask = ""; }

        document.getElementById('apex-setup').style.display = db.apexStatus === "setup" ? "block" : "none";
        document.getElementById('apex-active').style.display = db.apexStatus === "active" ? "block" : "none";
        document.getElementById('apex-done').style.display = db.apexStatus === "done" ? "block" : "none";
        document.getElementById('apex-display').innerText = db.apexTask;

        document.getElementById('side-list').innerHTML = db.sideQuests.map(q => `
            <div class="card" style="display:flex; justify-content:space-between; align-items:center; padding:15px">
                <span style="font-weight:700; font-size:0.9rem">${q.text}</span>
                <button style="background:var(--success); border:none; padding:8px 12px; border-radius:10px; font-weight:700" onclick="completeSide(${q.id})">OK</button>
            </div>
        `).join('');

        document.getElementById('log-list').innerHTML = db.logs.map(l => `
            <div class="card" style="font-size:0.85rem">
                <div style="color:var(--primary); font-weight:700; margin-bottom:5px">${l.date}</div>
                ${l.text}
            </div>
        `).join('');

        if(db.theme !== 'none') document.body.style.backgroundImage = `url('${db.theme}')`;
    }

    function addSide() {
        const i = document.getElementById('side-input');
        if(!i.value) return;
        db.sideQuests.push({id: Date.now(), text: i.value.toUpperCase()});
        i.value = ""; save(); render(); sound(600);
    }
    function completeSide(id) { db.sideQuests = db.sideQuests.filter(q => q.id !== id); addXP(20); }
    function addLog() {
        const i = document.getElementById('log-input');
        if(!i.value) return;
        db.logs.unshift({date: new Date().toLocaleString(), text: i.value});
        i.value = ""; save(); render(); sound(500);
    }
    function save() { localStorage.setItem('custom_rpg_v20', JSON.stringify(db)); }
    function exportData() {
        const b = new Blob([JSON.stringify(db)], {type: 'application/json'});
        const a = document.createElement('a'); a.href = URL.createObjectURL(b);
        a.download = `hero_v20.json`; a.click();
    }
    function importData(e) {
        const f = e.target.files[0]; const r = new FileReader();
        r.onload = (ev) => { db = JSON.parse(ev.target.result); save(); render(); alert("Sincronizado!"); };
        r.readAsText(f);
    }
    function resetAll() { if(confirm("Apagar tudo?")) { localStorage.clear(); location.reload(); } }

    render();
</script>
</body>
</html>
