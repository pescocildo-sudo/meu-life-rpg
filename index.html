<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SYSTEM - ARCHIVIST PROTOCOL</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&family=Space+Grotesk:wght@500;700&display=swap');
        :root { --bg: #0d0f14; --panel: rgba(26, 30, 41, 0.95); --primary: #00f3ff; --secondary: #7000ff; --text: #f0f4f8; --success: #00ffa3; --danger: #ff4d4d; --gray: #94a3b8; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; touch-action: manipulation; }
        body { font-family: 'Outfit', sans-serif; background-color: var(--bg); background-size: cover; background-position: center; background-attachment: fixed; color: var(--text); margin: 0; padding: 0; overflow: hidden; height: 100vh; }
        .bg-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: -1; }
        .app-container { display: flex; flex-direction: column; height: 100vh; max-width: 500px; margin: 0 auto; position: relative; }
        .main-content { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 130px; }
        
        /* HEADER */
        .header-profile { display: flex; align-items: center; gap: 15px; margin-top: 15px; margin-bottom: 25px; }
        .avatar-frame { width: 65px; height: 65px; border-radius: 50%; border: 2px solid var(--primary); overflow: hidden; background: #1a1e29; flex-shrink: 0; box-shadow: 0 0 15px rgba(0, 243, 255, 0.3); }
        .avatar-frame img { width: 100%; height: 100%; object-fit: cover; }
        #greeting-text { font-family: 'Space Grotesk', sans-serif; font-size: 1.5rem; font-weight: 700; color: #fff; margin: 0; }
        
        .view-title { font-family: 'Space Grotesk', sans-serif; font-size: 1.1rem; margin: 25px 0 15px 0; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; color: var(--gray); border-left: 4px solid var(--primary); padding-left: 10px; }
        
        .tab-content { display: none; animation: fadeIn 0.3s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* NAVIGATION */
        .nav-bar { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); width: 94%; max-width: 450px; height: 85px; background: rgba(22, 27, 38, 0.98); backdrop-filter: blur(20px); display: flex; justify-content: space-around; align-items: center; border-radius: 30px; border: 1px solid rgba(255,255,255,0.12); z-index: 1000; }
        .nav-item { background: none; border: none; color: var(--gray); display: flex; flex-direction: column; align-items: center; flex: 1; height: 100%; justify-content: center; }
        .nav-item.active { color: var(--primary); }
        .nav-item span { font-size: 28px; }

        /* CARDS & BUTTONS */
        .card { background: var(--panel); backdrop-filter: blur(15px); padding: 25px; border-radius: 28px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.08); }
        .btn-main { width: 100%; height: 70px; border-radius: 22px; border: none; background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #fff; font-size: 1.2rem; font-weight: 700; cursor: pointer; margin-top: 10px; }
        input, textarea { width: 100%; padding: 20px; background: rgba(255,255,255,0.07); border: 2px solid rgba(255,255,255,0.1); color: #fff; border-radius: 20px; margin-bottom: 15px; font-size: 1.1rem; font-family: inherit; }
        
        .quest-row { background: rgba(255,255,255,0.05); padding: 20px; border-radius: 22px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .btn-small { background: var(--success); border: none; height: 50px; padding: 0 25px; border-radius: 15px; font-weight: 700; }
        
        .log-item { border-left: 2px solid var(--primary); padding-left: 15px; margin-bottom: 20px; }
        .log-date { font-size: 0.75rem; color: var(--primary); font-weight: 700; margin-bottom: 5px; }
        .log-text { font-size: 1rem; line-height: 1.5; color: var(--text); }
    </style>
</head>
<body id="body-bg">
<div class="bg-overlay"></div>
<div class="app-container">
    <div class="main-content">
        <header class="header-profile">
            <div class="avatar-frame"><img id="display-avatar" src="https://via.placeholder.com/150/1a1e29/00f3ff?text=USER"></div>
            <div><h1 id="greeting-text">Olá...</h1><div style="font-size: 0.8rem; color: var(--primary);" id="lvl-status">Nível 1</div></div>
        </header>

        <div id="tab-status" class="tab-content active">
            <h2 class="view-title">Sua Evolução</h2>
            <div style="text-align:center; margin-bottom:30px;">
               <span style="font-size:5rem; font-weight:700; line-height:1" id="lvl-txt">1</span><br>
               <span id="xp-detail" style="color:var(--primary); font-weight:700; letter-spacing:2px">0 / 200 XP</span>
            </div>
            <div class="card">
                <h3 style="margin:0 0 15px 0; font-size:1rem;">🏆 VITÓRIAS RECENTES</h3>
                <div id="conquest-list"></div>
            </div>
        </div>

        <div id="tab-side" class="tab-content">
            <h2 class="view-title">Missões do Dia</h2>
            <div id="side-list"></div>
            <h2 class="view-title">Extra</h2>
            <input type="text" id="side-input" placeholder="Nova tarefa avulsa...">
            <button class="btn-main" onclick="addSide()">ADICIONAR</button>
        </div>

        <div id="tab-log" class="tab-content">
            <h2 class="view-title">Relatórios</h2>
            <textarea id="log-input" rows="4" placeholder="Escreva seu relatório de hoje..."></textarea>
            <button class="btn-main" onclick="addLog()">ARQUIVAR RELATÓRIO</button>
            <div id="log-list" style="margin-top:30px"></div>
        </div>

        <div id="tab-sys" class="tab-content">
            <h2 class="view-title">Rotina Diária</h2>
            <div class="card">
                <input type="text" id="routine-input" placeholder="Tarefa que se repete todo dia">
                <button class="btn-main" style="height:55px; font-size:1rem" onclick="addRoutine()">FIXAR NA ROTINA</button>
                <div id="routine-list" style="margin-top:20px"></div>
            </div>
            <h2 class="view-title">Configurações</h2>
            <div class="card">
                <input type="text" id="player-name-input" placeholder="Seu nome">
                <input type="text" id="player-img-input" placeholder="URL da foto">
                <button class="btn-main" onclick="updateProfile()">ATUALIZAR PERFIL</button>
            </div>
            <button class="btn-main" style="background:var(--success); color:#000" onclick="exportData()">EXPORTAR TUDO (JSON)</button>
            <button class="btn-main" style="background:var(--gray); color:#000" onclick="document.getElementById('f-in').click()">IMPORTAR BACKUP</button>
            <input type="file" id="f-in" style="display:none" onchange="importData(event)">
            <button class="btn-main" style="background:none; border:2px solid var(--danger); color:var(--danger)" onclick="resetAll()">RESET TOTAL</button>
        </div>
    </div>

    <nav class="nav-bar">
        <button class="nav-item active" onclick="nav('tab-status', this)"><span>📊</span></button>
        <button class="nav-item" onclick="nav('tab-side', this)"><span>⚔️</span></button>
        <button class="nav-item" onclick="nav('tab-log', this)"><span>📜</span></button>
        <button class="nav-item" onclick="nav('tab-sys', this)"><span>⚙️</span></button>
    </nav>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('archivist_v27')) || {
        xp: 0, playerName: "Jogador", playerImg: "",
        sideQuests: [], routine: [], logs: [], dailyConquests: [],
        lastLoginDate: ""
    };

    function save() { localStorage.setItem('archivist_v27', JSON.stringify(db)); }

    function checkDailyReset() {
        const today = new Date().toLocaleDateString();
        if (db.lastLoginDate !== today) {
            db.dailyConquests = [];
            db.routine.forEach(task => {
                if(!db.sideQuests.some(q => q.text === task)) {
                    db.sideQuests.push({ id: Date.now() + Math.random(), text: task, type: 'ROUTINE' });
                }
            });
            db.lastLoginDate = today;
            save();
        }
    }

    function render() {
        const lvl = Math.floor(db.xp / 200) + 1;
        document.getElementById('lvl-txt').innerText = lvl;
        document.getElementById('lvl-status').innerText = `Nível ${lvl}`;
        document.getElementById('xp-detail').innerText = `${db.xp % 200} / 200 XP`;
        if(db.playerImg) document.getElementById('display-avatar').src = db.playerImg;
        document.getElementById('greeting-text').innerText = `Olá, ${db.playerName}`;

        document.getElementById('side-list').innerHTML = db.sideQuests.map(q => `
            <div class="quest-row">
                <span>${q.text} ${q.type === 'ROUTINE' ? '🔄' : '⚡'}</span>
                <button class="btn-small" onclick="completeQuest(${q.id})">OK</button>
            </div>`).join('');

        document.getElementById('routine-list').innerHTML = db.routine.map((text, idx) => `
            <div style="display:flex; justify-content:space-between; margin-bottom:10px; background:rgba(255,255,255,0.05); padding:10px; border-radius:10px">
                <span>${text}</span>
                <button style="color:var(--danger); background:none; border:none;" onclick="removeRoutine(${idx})">Remover</button>
            </div>`).join('');

        document.getElementById('log-list').innerHTML = db.logs.map(l => `
            <div class="log-item">
                <div class="log-date">${l.date}</div>
                <div class="log-text">${l.text}</div>
            </div>`).join('');

        document.getElementById('conquest-list').innerHTML = db.dailyConquests.length > 0 ? 
            db.dailyConquests.map(c => `<div style="color:var(--success); margin-bottom:8px">✓ ${c}</div>`).join('') :
            `<div style="color:var(--gray); font-size:0.8rem">Nenhuma vitória hoje ainda.</div>`;
    }

    function addLog() {
        const i = document.getElementById('log-input');
        if(!i.value) return;
        db.logs.unshift({ date: new Date().toLocaleString(), text: i.value });
        i.value = ""; save(); render();
    }

    function addSide() {
        const i = document.getElementById('side-input');
        if(!i.value) return;
        db.sideQuests.push({ id: Date.now(), text: i.value.toUpperCase(), type: 'MANUAL' });
        i.value = ""; save(); render();
    }

    function completeQuest(id) {
        const q = db.sideQuests.find(x => x.id === id);
        db.dailyConquests.push(q.text);
        db.sideQuests = db.sideQuests.filter(x => x.id !== id);
        db.xp += 20;
        save(); render();
    }

    function addRoutine() {
        const i = document.getElementById('routine-input');
        if(!i.value) return;
        db.routine.push(i.value.toUpperCase());
        db.sideQuests.push({ id: Date.now(), text: i.value.toUpperCase(), type: 'ROUTINE' });
        i.value = ""; save(); render();
    }

    function removeRoutine(idx) { db.routine.splice(idx, 1); save(); render(); }
    
    function updateProfile() {
        db.playerName = document.getElementById('player-name-input').value || db.playerName;
        db.playerImg = document.getElementById('player-img-input').value || db.playerImg;
        save(); render(); alert("Perfil atualizado!");
    }

    function nav(id, btn) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        btn.classList.add('active');
    }

    function exportData() {
        const b = new Blob([JSON.stringify(db)], {type:'application/json'});
        const a = document.createElement('a'); a.href = URL.createObjectURL(b);
        a.download = `backup_progresso.json`; a.click();
    }

    function importData(e) {
        const f = e.target.files[0];
        const r = new FileReader();
        r.onload = (ev) => { db = JSON.parse(ev.target.result); save(); render(); alert("Dados importados!"); };
        r.readAsText(f);
    }

    function resetAll() { if(confirm("Isso apagará todos os relatórios e progresso. Continuar?")) { localStorage.clear(); location.reload(); } }
    
    checkDailyReset();
    render();
</script>
</body>
</html>
