<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SYSTEM - LEGACY LEDGER</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&family=Space+Grotesk:wght@500;700&display=swap');

        :root {
            --bg: #0d0f14;
            --panel: rgba(26, 30, 41, 0.9);
            --primary: #00f3ff;
            --secondary: #7000ff;
            --text: #f0f4f8;
            --success: #00ffa3;
            --danger: #ff4d4d;
            --gray: #94a3b8;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }

        body { 
            font-family: 'Outfit', sans-serif; 
            background-color: var(--bg); background-size: cover; background-position: center; background-attachment: fixed;
            color: var(--text); margin: 0; padding: 0; overflow: hidden; height: 100vh;
        }

        .bg-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: -1; }

        .app-container { display: flex; flex-direction: column; height: 100vh; max-width: 500px; margin: 0 auto; }
        .main-content { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 110px; }

        .view-title { font-family: 'Space Grotesk', sans-serif; font-size: 1.8rem; margin: 10px 0 15px 0; font-weight: 700; }
        
        .tab-content { display: none; animation: fadeIn 0.3s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .nav-bar {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 400px; height: 75px;
            background: rgba(26, 30, 41, 0.95); backdrop-filter: blur(15px);
            display: flex; justify-content: space-around; align-items: center;
            border-radius: 25px; border: 1px solid rgba(255,255,255,0.1); z-index: 1000;
        }
        .nav-item { background: none; border: none; color: var(--gray); display: flex; flex-direction: column; align-items: center; flex: 1; }
        .nav-item.active { color: var(--primary); text-shadow: 0 0 10px var(--primary); }

        /* STATUS */
        .progress-center { position: relative; width: 160px; height: 160px; margin: 10px auto; display: flex; justify-content: center; align-items: center; }
        .pie-chart { width: 100%; height: 100%; border-radius: 50%; background: conic-gradient(var(--primary) 0deg, rgba(255,255,255,0.1) 0deg); transition: 0.5s; }
        .pie-inner { position: absolute; width: 135px; height: 135px; background: var(--panel); border-radius: 50%; display: flex; flex-direction: column; justify-content: center; align-items: center; }

        .card { background: var(--panel); backdrop-filter: blur(10px); padding: 18px; border-radius: 20px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.05); }
        
        /* LISTA DE CONQUISTAS NO DASH */
        .conquest-item { 
            display: flex; align-items: center; gap: 10px; font-size: 0.9rem; padding: 8px 0; 
            border-bottom: 1px solid rgba(255,255,255,0.05); color: var(--success);
        }
        .conquest-item span { text-decoration: line-through; color: var(--gray); }
        .conquest-badge { background: var(--success); color: #000; font-size: 0.6rem; font-weight: 700; padding: 2px 6px; border-radius: 4px; }

        .btn-main { width: 100%; min-height: 60px; border-radius: 18px; border: none; background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #fff; font-size: 1rem; font-weight: 700; font-family: 'Space Grotesk', sans-serif; cursor: pointer; }
        input, textarea { width: 100%; padding: 15px; background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.1); color: #fff; border-radius: 15px; margin-bottom: 10px; font-family: inherit; }

        .quest-row { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 15px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    </style>
</head>
<body id="body-bg">
<div class="bg-overlay"></div>

<div class="app-container">
    <div class="main-content">
        
        <div id="tab-status" class="tab-content active">
            <h1 class="view-title">Dashboard</h1>
            <div class="progress-center">
                <div class="pie-chart" id="pie-chart"></div>
                <div class="pie-inner">
                    <span style="font-size:3rem; font-weight:700; line-height:1" id="lvl-txt">1</span>
                    <span style="font-size:0.7rem; color:var(--primary); font-weight:700" id="rank-txt">RECRUTA</span>
                </div>
            </div>

            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:15px">
                <div class="card" style="text-align:center; padding:12px">
                    <div style="color:var(--primary); font-size:1.2rem; font-weight:700" id="stat-xp">0</div>
                    <div style="font-size:0.6rem; color:var(--gray)">XP TOTAL</div>
                </div>
                <div class="card" style="text-align:center; padding:12px">
                    <div style="color:var(--success); font-size:1.2rem; font-weight:700" id="stat-streak">0</div>
                    <div style="font-size:0.6rem; color:var(--gray)">STREAK</div>
                </div>
            </div>

            <div class="card">
                <h3 style="margin-top:0; font-size:1rem; color:var(--primary)">CONQUISTAS DE HOJE</h3>
                <div id="conquest-list">
                    <p style="font-size:0.8rem; color:var(--gray); text-align:center">Nenhuma missão concluída hoje.</p>
                </div>
            </div>
        </div>

        <div id="tab-apex" class="tab-content">
            <h1 class="view-title">Objetivo Apex</h1>
            <div id="apex-setup" class="card">
                <input type="text" id="apex-input" placeholder="O que importa hoje?">
                <button class="btn-main" onclick="setApex()">DEFINIR FOCO</button>
            </div>
            <div id="apex-active" class="card" style="display:none; text-align:center;">
                <div style="font-size:1.5rem; font-weight:700; margin:20px 0" id="apex-display">---</div>
                <button class="btn-main" onclick="completeApex()">CONCLUIR (+100 XP)</button>
            </div>
            <div id="apex-done" class="card" style="display:none; text-align:center">
                <div style="font-size:3rem">⭐</div>
                <h3>APEX DOMINADO</h3>
            </div>
        </div>

        <div id="tab-side" class="tab-content">
            <h1 class="view-title">Side Quests</h1>
            <input type="text" id="side-input" placeholder="Nova tarefa...">
            <button class="btn-main" style="min-height:45px; background:none; border:1px solid var(--primary); color:var(--primary)" onclick="addSide()">+ ADICIONAR</button>
            <div id="side-list" style="margin-top:20px"></div>
        </div>

        <div id="tab-log" class="tab-content">
            <h1 class="view-title">Relatório</h1>
            <textarea id="log-input" rows="3" placeholder="Progresso do dia..."></textarea>
            <button class="btn-main" onclick="addLog()">GRAVAR LOG</button>
            <div id="log-list" style="margin-top:20px"></div>
        </div>

        <div id="tab-sys" class="tab-content">
            <h1 class="view-title">Sistema</h1>
            <div class="card">
                <h3>Plano de Fundo</h3>
                <input type="text" id="custom-bg" placeholder="URL da imagem">
                <button class="btn-main" style="min-height:40px; font-size:0.8rem" onclick="setTheme(document.getElementById('custom-bg').value)">APLICAR</button>
            </div>
            <div class="card">
                <button class="btn-main" style="background:var(--success); color:#000; margin-bottom:10px" onclick="exportData()">EXPORTAR</button>
                <button class="btn-main" style="background:var(--gray)" onclick="document.getElementById('f-in').click()">IMPORTAR</button>
                <input type="file" id="f-in" style="display:none" onchange="importData(event)">
            </div>
            <button class="btn-main" style="background:none; border:1px solid var(--danger); color:var(--danger)" onclick="resetAll()">RESET TOTAL</button>
        </div>

    </div>

    <nav class="nav-bar">
        <button class="nav-item active" onclick="nav('tab-status', this)"><span>📊</span></button>
        <button class="nav-item" onclick="nav('tab-apex', this)"><span>⭐</span></button>
        <button class="nav-item" onclick="nav('tab-side', this)"><span>⚔️</span></button>
        <button class="nav-item" onclick="nav('tab-log', this)"><span>📜</span></button>
        <button class="nav-item" onclick="nav('tab-sys', this)"><span>⚙️</span></button>
    </nav>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('solo_v21_ledger')) || {
        xp: 0, lvl: 1, streak: 0,
        apexTask: "", apexStatus: "setup", lastReset: "",
        sideQuests: [], logs: [], theme: "none",
        dailyConquests: [] // Novo campo para o dashboard
    };

    const audio = new (window.AudioContext || window.webkitAudioContext)();
    function sound(f, t='sine', d=0.2, v=0.1) {
        const o = audio.createOscillator(); const g = audio.createGain();
        o.type = t; o.frequency.value = f; g.gain.setValueAtTime(v, audio.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, audio.currentTime+d);
        o.connect(g); g.connect(audio.destination); o.start(); o.stop(audio.currentTime+d);
    }

    function nav(id, btn) {
        sound(400, 'triangle', 0.1, 0.05);
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        btn.classList.add('active');
        render();
    }

    function addXP(amount) {
        db.xp += amount; db.lvl = Math.floor(db.xp / 200) + 1;
        save(); render(); sound(800, 'square', 0.3);
    }

    // --- LOGICA DE CONQUISTAS ---
    function registerConquest(text, type) {
        db.dailyConquests.push({ text: text, type: type, date: new Date().toLocaleDateString() });
    }

    function setApex() {
        const v = document.getElementById('apex-input').value;
        if(!v) return;
        db.apexTask = v.toUpperCase(); db.apexStatus = "active";
        save(); render(); sound(600);
    }

    function completeApex() {
        registerConquest(db.apexTask, 'APEX');
        db.apexStatus = "done"; db.lastReset = new Date().toLocaleDateString();
        db.streak++; addXP(100);
    }

    function addSide() {
        const i = document.getElementById('side-input');
        if(!i.value) return;
        db.sideQuests.push({id: Date.now(), text: i.value.toUpperCase()});
        i.value = ""; save(); render(); sound(600);
    }

    function completeSide(id) {
        const quest = db.sideQuests.find(q => q.id === id);
        registerConquest(quest.text, 'SIDE');
        db.sideQuests = db.sideQuests.filter(q => q.id !== id);
        addXP(20);
    }

    function setTheme(url) { db.theme = url; save(); render(); }

    function render() {
        const today = new Date().toLocaleDateString();
        
        // Reset Diário de Conquistas e Apex
        if(db.lastReset !== today) {
            db.dailyConquests = db.dailyConquests.filter(c => c.date === today);
            if(db.apexStatus === "done") { db.apexStatus = "setup"; db.apexTask = ""; }
            db.lastReset = today;
            save();
        }

        // Stats UI
        const xpInLvl = db.xp % 200;
        document.getElementById('lvl-txt').innerText = db.lvl;
        document.getElementById('stat-xp').innerText = db.xp;
        document.getElementById('stat-streak').innerText = db.streak;
        document.getElementById('pie-chart').style.background = `conic-gradient(var(--primary) ${(xpInLvl/200)*360}deg, rgba(255,255,255,0.1) 0deg)`;
        
        // Dashboard Conquests
        const conquestDiv = document.getElementById('conquest-list');
        if(db.dailyConquests.length > 0) {
            conquestDiv.innerHTML = db.dailyConquests.map(c => `
                <div class="conquest-item">
                    <div class="conquest-badge">${c.type}</div>
                    <span>${c.text}</span>
                </div>
            `).join('');
        } else {
            conquestDiv.innerHTML = `<p style="font-size:0.8rem; color:var(--gray); text-align:center">Nenhuma missão concluída hoje.</p>`;
        }

        // Apex UI
        document.getElementById('apex-setup').style.display = db.apexStatus === "setup" ? "block" : "none";
        document.getElementById('apex-active').style.display = db.apexStatus === "active" ? "block" : "none";
        document.getElementById('apex-done').style.display = db.apexStatus === "done" ? "block" : "none";
        document.getElementById('apex-display').innerText = db.apexTask;

        // Side UI
        document.getElementById('side-list').innerHTML = db.sideQuests.map(q => `
            <div class="quest-row">
                <span style="font-weight:700; font-size:0.9rem">${q.text}</span>
                <button style="background:var(--success); border:none; padding:8px 15px; border-radius:10px; font-weight:700" onclick="completeSide(${q.id})">OK</button>
            </div>
        `).join('');

        // Logs
        document.getElementById('log-list').innerHTML = db.logs.map(l => `<div class="card" style="font-size:0.8rem"><div style="color:var(--primary); font-weight:700">${l.date}</div>${l.text}</div>`).join('');

        if(db.theme !== 'none') document.body.style.backgroundImage = `url('${db.theme}')`;
    }

    function addLog() {
        const i = document.getElementById('log-input'); if(!i.value) return;
        db.logs.unshift({date: new Date().toLocaleString(), text: i.value});
        i.value = ""; save(); render();
    }
    function save() { localStorage.setItem('solo_v21_ledger', JSON.stringify(db)); }
    function exportData() {
        const b = new Blob([JSON.stringify(db)], {type: 'application/json'});
        const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `hero_progress.json`; a.click();
    }
    function importData(e) {
        const f = e.target.files[0]; const r = new FileReader();
        r.onload = (ev) => { db = JSON.parse(ev.target.result); save(); render(); alert("Sincronizado!"); };
        r.readAsText(f);
    }
    function resetAll() { if(confirm("Apagar tudo?")) { localStorage.clear(); location.reload(); } }

    render();
</script>
</body>
</html>
