<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SYSTEM - THE ARCHITECT'S SANCTUARY</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&family=Space+Grotesk:wght@500;700&display=swap');

        :root {
            --bg: #0d0f14;
            --panel: rgba(26, 30, 41, 0.9);
            --primary: #00f3ff;
            --secondary: #7000ff;
            --text: #f0f4f8;
            --success: #00ffa3;
            --danger: #ff4d4d;
            --gray: #94a3b8;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }

        body { 
            font-family: 'Outfit', sans-serif; 
            background-color: var(--bg); background-size: cover; background-position: center; background-attachment: fixed;
            color: var(--text); margin: 0; padding: 0; overflow: hidden; height: 100vh;
        }

        .bg-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.55); z-index: -1; }

        .app-container { display: flex; flex-direction: column; height: 100vh; max-width: 500px; margin: 0 auto; position: relative; }
        .main-content { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 110px; }

        /* HEADER DINÂMICO */
        .header-greeting { margin-top: 10px; }
        #greeting-text { font-family: 'Space Grotesk', sans-serif; font-size: 1.6rem; font-weight: 700; color: #fff; margin: 0; }
        #quote-text { font-size: 0.85rem; color: var(--primary); font-style: italic; opacity: 0.9; margin-top: 5px; min-height: 40px; }

        .view-title { font-family: 'Space Grotesk', sans-serif; font-size: 1.2rem; margin: 20px 0 10px 0; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; color: var(--gray); }
        
        .tab-content { display: none; animation: fadeIn 0.3s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* BARRA DE NAVEGAÇÃO */
        .nav-bar {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 92%; max-width: 420px; height: 70px;
            background: rgba(26, 30, 41, 0.96); backdrop-filter: blur(20px);
            display: flex; justify-content: space-around; align-items: center;
            border-radius: 25px; border: 1px solid rgba(255,255,255,0.1); z-index: 1000;
        }
        .nav-item { background: none; border: none; color: var(--gray); display: flex; flex-direction: column; align-items: center; flex: 1; cursor: pointer; transition: 0.3s; }
        .nav-item.active { color: var(--primary); transform: translateY(-5px); text-shadow: 0 0 15px var(--primary); }

        /* DASHBOARD & BARS */
        .progress-center { position: relative; width: 140px; height: 140px; margin: 10px auto; display: flex; justify-content: center; align-items: center; }
        .pie-chart { width: 100%; height: 100%; border-radius: 50%; background: conic-gradient(var(--primary) 0deg, rgba(255,255,255,0.1) 0deg); transition: 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        .pie-inner { position: absolute; width: 115px; height: 115px; background: var(--panel); border-radius: 50%; display: flex; flex-direction: column; justify-content: center; align-items: center; }

        .bar-container { width: 100%; height: 12px; background: rgba(255,255,255,0.1); border-radius: 6px; margin: 15px 0; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); }
        .bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--primary), var(--secondary)); transition: 1s ease-out; }

        .card { background: var(--panel); backdrop-filter: blur(10px); padding: 18px; border-radius: 20px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.05); }
        
        .conquest-item { display: flex; align-items: center; gap: 10px; font-size: 0.85rem; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); color: var(--success); }
        .conquest-item span { text-decoration: line-through; color: var(--gray); }
        .conquest-badge { background: var(--success); color: #000; font-size: 0.6rem; font-weight: 700; padding: 2px 6px; border-radius: 4px; }

        /* BUTTONS & INPUTS */
        .btn-main { width: 100%; min-height: 55px; border-radius: 16px; border: none; background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #fff; font-size: 1rem; font-weight: 700; font-family: 'Space Grotesk', sans-serif; cursor: pointer; transition: 0.2s; }
        .btn-main:active { transform: scale(0.96); opacity: 0.8; }
        input, textarea { width: 100%; padding: 15px; background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.1); color: #fff; border-radius: 15px; margin-bottom: 10px; font-family: inherit; }

        .victory-flash { animation: flashEffect 0.6s ease-out; }
        @keyframes flashEffect { 0% { background: transparent; } 50% { background: var(--primary); opacity: 0.3; } 100% { background: transparent; } }
    </style>
</head>
<body id="body-bg">
<div class="bg-overlay" id="flash-overlay"></div>

<div class="app-container">
    <div class="main-content">
        
        <header class="header-greeting">
            <h1 id="greeting-text">Iniciando...</h1>
            <div id="quote-text">"O sucesso é a soma de pequenos esforços."</div>
        </header>

        <div id="tab-status" class="tab-content active">
            <h2 class="view-title">Visão Geral</h2>
            <div class="progress-center">
                <div class="pie-chart" id="pie-chart"></div>
                <div class="pie-inner">
                    <span style="font-size:2.8rem; font-weight:700; line-height:1" id="lvl-txt">1</span>
                    <span style="font-size:0.6rem; color:var(--primary); font-weight:700; letter-spacing:1px" id="rank-txt">RECRUTA</span>
                </div>
            </div>

            <div class="bar-container">
                <div class="bar-fill" id="lvl-bar"></div>
            </div>
            <div style="text-align:right; font-size:0.7rem; color:var(--gray); margin-top:-10px" id="xp-detail">0 / 200 XP</div>

            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:15px">
                <div class="card" style="text-align:center; padding:12px">
                    <div style="color:var(--primary); font-size:1.2rem; font-weight:700" id="stat-xp">0</div>
                    <div style="font-size:0.6rem; color:var(--gray)">XP TOTAL</div>
                </div>
                <div class="card" style="text-align:center; padding:12px">
                    <div style="color:var(--success); font-size:1.2rem; font-weight:700" id="stat-streak">0</div>
                    <div style="font-size:0.6rem; color:var(--gray)">DIAS ATIVOS</div>
                </div>
            </div>

            <div class="card">
                <h3 style="margin:0 0 10px 0; font-size:0.9rem; color:var(--primary)">CONQUISTAS DE HOJE</h3>
                <div id="conquest-list"></div>
            </div>
        </div>

        <div id="tab-apex" class="tab-content">
            <h2 class="view-title">Missão Principal</h2>
            <div id="apex-setup" class="card">
                <input type="text" id="apex-input" placeholder="Qual seu grande objetivo?">
                <button class="btn-main" onclick="setApex()">DEFINIR FOCO</button>
            </div>
            <div id="apex-active" class="card" style="display:none; text-align:center; border: 1px solid var(--primary);">
                <div style="font-size:1.5rem; font-weight:700; margin:20px 0" id="apex-display">---</div>
                <button class="btn-main" onclick="completeApex()">CONCLUIR MISSÃO (+100 XP)</button>
                <button style="background:none; border:none; color:var(--gray); margin-top:15px; font-size:0.7rem" onclick="cancelApex()">REDEFINIR</button>
            </div>
            <div id="apex-done" class="card" style="display:none; text-align:center; border: 1px solid var(--success);">
                <div style="font-size:2.5rem">🏆</div>
                <h3>ALVO ELIMINADO</h3>
                <p style="color:var(--gray); font-size:0.8rem">Você dominou o dia de hoje.</p>
            </div>
        </div>

        <div id="tab-side" class="tab-content">
            <h2 class="view-title">Side Quests</h2>
            <input type="text" id="side-input" placeholder="Nova tarefa rápida...">
            <button class="btn-main" style="min-height:45px; background:none; border:1px solid var(--primary); color:var(--primary)" onclick="addSide()">ADICIONAR</button>
            <div id="side-list" style="margin-top:15px"></div>
        </div>

        <div id="tab-log" class="tab-content">
            <h2 class="view-title">Relatório de Campo</h2>
            <textarea id="log-input" rows="3" placeholder="O que aprendeu hoje?"></textarea>
            <button class="btn-main" onclick="addLog()">GRAVAR ENTRADA</button>
            <div id="log-list" style="margin-top:15px"></div>
        </div>

        <div id="tab-sys" class="tab-content">
            <h2 class="view-title">Sistema</h2>
            <div class="card">
                <h3 style="margin-top:0">Personalizar HQ</h3>
                <input type="text" id="custom-bg" placeholder="URL da imagem de fundo">
                <button class="btn-main" style="min-height:40px; font-size:0.8rem" onclick="setTheme(document.getElementById('custom-bg').value)">APLICAR TEMA</button>
            </div>
            <div class="card">
                <button class="btn-main" style="background:var(--success); color:#000; margin-bottom:10px" onclick="exportData()">EXPORTAR DADOS</button>
                <button class="btn-main" style="background:var(--gray)" onclick="document.getElementById('f-in').click()">IMPORTAR DADOS</button>
                <input type="file" id="f-in" style="display:none" onchange="importData(event)">
            </div>
            <button class="btn-main" style="background:none; border:1px solid var(--danger); color:var(--danger)" onclick="resetAll()">RESET DE FÁBRICA</button>
        </div>

    </div>

    <nav class="nav-bar">
        <button class="nav-item active" onclick="nav('tab-status', this)"><span>📊</span></button>
        <button class="nav-item" onclick="nav('tab-apex', this)"><span>⭐</span></button>
        <button class="nav-item" onclick="nav('tab-side', this)"><span>⚔️</span></button>
        <button class="nav-item" onclick="nav('tab-log', this)"><span>📜</span></button>
        <button class="nav-item" onclick="nav('tab-sys', this)"><span>⚙️</span></button>
    </nav>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('sanctuary_v22')) || {
        xp: 0, lvl: 1, streak: 0,
        apexTask: "", apexStatus: "setup", lastReset: "",
        sideQuests: [], logs: [], theme: "none",
        dailyConquests: []
    };

    const quotes = [
        "A disciplina é a liberdade.",
        "O que não te mata, te fortalece.",
        "Pequenos passos, grandes distâncias.",
        "Sua única competição é quem você foi ontem.",
        "O foco é o superpoder do século 21.",
        "Não pare quando estiver cansado, pare quando terminar.",
        "A maestria exige paciência."
    ];

    const audio = new (window.AudioContext || window.webkitAudioContext)();
    function sound(f, t='sine', d=0.2, v=0.1) {
        const o = audio.createOscillator(); const g = audio.createGain();
        o.type = t; o.frequency.value = f; g.gain.setValueAtTime(v, audio.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, audio.currentTime+d);
        o.connect(g); g.connect(audio.destination); o.start(); o.stop(audio.currentTime+d);
    }

    function updateHeader() {
        const hour = new Date().getHours();
        let g = "Boa madrugada";
        if(hour >= 5 && hour < 12) g = "Bom dia";
        else if(hour >= 12 && hour < 18) g = "Boa tarde";
        else if(hour >= 18) g = "Boa noite";
        
        document.getElementById('greeting-text').innerText = `${g}, Arquiteto.`;
        document.getElementById('quote-text').innerText = `"${quotes[Math.floor(Math.random() * quotes.length)]}"`;
    }

    function nav(id, btn) {
        sound(450, 'triangle', 0.1, 0.05);
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        btn.classList.add('active');
        updateHeader(); // Muda a frase ao navegar
        render();
    }

    function setApex() {
        const v = document.getElementById('apex-input').value;
        if(!v) return;
        db.apexTask = v.toUpperCase(); db.apexStatus = "active";
        save(); render(); sound(600);
    }

    function completeApex() {
        const flash = document.getElementById('flash-overlay');
        flash.classList.add('victory-flash');
        setTimeout(() => flash.classList.remove('victory-flash'), 600);
        
        db.dailyConquests.push({ text: db.apexTask, type: 'APEX', date: new Date().toLocaleDateString() });
        db.apexStatus = "done"; db.lastReset = new Date().toLocaleDateString();
        db.streak++; addXP(100);
        sound(800, 'square', 0.4); sound(1100, 'square', 0.4);
    }

    function addXP(amount) {
        db.xp += amount; db.lvl = Math.floor(db.xp / 200) + 1;
        save(); render(); sound(1000, 'sine', 0.3);
    }

    function render() {
        const today = new Date().toLocaleDateString();
        if(db.lastReset !== today) {
            db.dailyConquests = db.dailyConquests.filter(c => c.date === today);
            if(db.apexStatus === "done") { db.apexStatus = "setup"; db.apexTask = ""; }
        }

        const xpInLvl = db.xp % 200;
        const perc = (xpInLvl / 200) * 100;
        
        document.getElementById('lvl-txt').innerText = db.lvl;
        document.getElementById('stat-xp').innerText = db.xp;
        document.getElementById('stat-streak').innerText = db.streak;
        document.getElementById('xp-detail').innerText = `${xpInLvl} / 200 XP`;
        document.getElementById('lvl-bar').style.width = `${perc}%`;
        document.getElementById('pie-chart').style.background = `conic-gradient(var(--primary) ${perc * 3.6}deg, rgba(255,255,255,0.1) 0deg)`;
        
        const conquestDiv = document.getElementById('conquest-list');
        conquestDiv.innerHTML = db.dailyConquests.length > 0 ? 
            db.dailyConquests.map(c => `<div class="conquest-item"><div class="conquest-badge">${c.type}</div><span>${c.text}</span></div>`).join('') :
            `<p style="font-size:0.75rem; color:var(--gray); text-align:center">Pronto para a primeira vitória?</p>`;

        document.getElementById('apex-setup').style.display = db.apexStatus === "setup" ? "block" : "none";
        document.getElementById('apex-active').style.display = db.apexStatus === "active" ? "block" : "none";
        document.getElementById('apex-done').style.display = db.apexStatus === "done" ? "block" : "none";
        document.getElementById('apex-display').innerText = db.apexTask;

        document.getElementById('side-list').innerHTML = db.sideQuests.map(q => `
            <div class="card" style="display:flex; justify-content:space-between; align-items:center; padding:12px">
                <span style="font-weight:700; font-size:0.85rem">${q.text}</span>
                <button style="background:var(--success); border:none; padding:8px 12px; border-radius:10px; font-weight:700" onclick="completeSide(${q.id})">OK</button>
            </div>`).join('');

        document.getElementById('log-list').innerHTML = db.logs.map(l => `<div class="card" style="font-size:0.8rem"><div style="color:var(--primary); font-weight:700">${l.date}</div>${l.text}</div>`).join('');
        if(db.theme !== 'none') document.body.style.backgroundImage = `url('${db.theme}')`;
    }

    function completeSide(id) {
        const q = db.sideQuests.find(x => x.id === id);
        db.dailyConquests.push({ text: q.text, type: 'SIDE', date: new Date().toLocaleDateString() });
        db.sideQuests = db.sideQuests.filter(x => x.id !== id);
        addXP(20);
    }
    function addSide() { const i = document.getElementById('side-input'); if(!i.value) return; db.sideQuests.push({id: Date.now(), text: i.value.toUpperCase()}); i.value = ""; save(); render(); sound(600); }
    function addLog() { const i = document.getElementById('log-input'); if(!i.value) return; db.logs.unshift({date: new Date().toLocaleString(), text: i.value}); i.value = ""; save(); render(); }
    function save() { localStorage.setItem('sanctuary_v22', JSON.stringify(db)); }
    function exportData() { const b = new Blob([JSON.stringify(db)], {type:'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `ark_progress.json`; a.click(); }
    function importData(e) { const f = e.target.files[0]; const r = new FileReader(); r.onload = (ev) => { db = JSON.parse(ev.target.result); save(); render(); alert("Sincronizado!"); }; r.readAsText(f); }
    function resetAll() { if(confirm("Apagar tudo?")) { localStorage.clear(); location.reload(); } }
    function cancelApex() { if(confirm("Mudar foco?")) { db.apexStatus = "setup"; db.apexTask = ""; save(); render(); } }
    function setTheme(u) { db.theme = u; save(); render(); }

    updateHeader();
    render();
</script>
</body>
</html>
