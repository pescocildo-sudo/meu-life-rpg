<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SYSTEM - CORE UNITY</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&family=Space+Grotesk:wght@500;700&display=swap');
        :root { --bg: #0d0f14; --panel: rgba(26, 30, 41, 0.98); --primary: #00f3ff; --secondary: #7000ff; --text: #f0f4f8; --success: #00ffa3; --danger: #ff4d4d; --gray: #94a3b8; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { font-family: 'Outfit', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 0; overflow: hidden; height: 100vh; }
        .app-container { display: flex; flex-direction: column; height: 100vh; max-width: 500px; margin: 0 auto; position: relative; }
        .main-content { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 120px; }
        
        /* HEADER */
        .header-profile { display: flex; align-items: center; gap: 15px; margin: 15px 0 25px 0; }
        .avatar-frame { width: 60px; height: 60px; border-radius: 50%; border: 2px solid var(--primary); overflow: hidden; background: #1a1e29; flex-shrink: 0; box-shadow: 0 0 15px rgba(0, 243, 255, 0.2); }
        .avatar-frame img { width: 100%; height: 100%; object-fit: cover; }
        #greeting-text { font-family: 'Space Grotesk', sans-serif; font-size: 1.3rem; font-weight: 700; margin: 0; }
        
        /* STATUS & WEEKLY */
        .progress-center { position: relative; width: 140px; height: 140px; margin: 0 auto; display: flex; justify-content: center; align-items: center; }
        .pie-chart { width: 100%; height: 100%; border-radius: 50%; background: conic-gradient(var(--primary) 0deg, rgba(255,255,255,0.05) 0deg); transition: 0.8s; }
        .pie-inner { position: absolute; width: 115px; height: 115px; background: var(--bg); border-radius: 50%; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        
        .weekly-grid { display: flex; justify-content: space-between; align-items: flex-end; height: 60px; margin-top: 20px; padding: 10px; background: rgba(255,255,255,0.03); border-radius: 15px; }
        .day-bar { width: 10px; background: rgba(255,255,255,0.1); border-radius: 5px; transition: 0.5s; min-height: 5px; }
        .day-bar.active { background: var(--primary); box-shadow: 0 0 8px var(--primary); }

        /* UI ELEMENTS */
        .view-title { font-family: 'Space Grotesk', sans-serif; font-size: 0.9rem; margin: 25px 0 15px; color: var(--gray); text-transform: uppercase; letter-spacing: 2px; border-left: 3px solid var(--primary); padding-left: 10px; }
        .card { background: var(--panel); padding: 20px; border-radius: 25px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.05); }
        .btn-main { width: 100%; height: 65px; border-radius: 20px; border: none; background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #fff; font-size: 1.1rem; font-weight: 700; cursor: pointer; }
        input, textarea { width: 100%; padding: 18px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff; border-radius: 15px; margin-bottom: 12px; font-size: 1rem; }
        
        /* QUEST LIST (UNIFICADA) */
        .quest-box { background: rgba(255,255,255,0.04); padding: 18px; border-radius: 20px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-right: 4px solid var(--secondary); transition: 0.3s; }
        .quest-box.is-routine { border-right-color: var(--primary); }
        .quest-info { display: flex; flex-direction: column; gap: 4px; }
        .quest-tag { font-size: 0.6rem; font-weight: 800; letter-spacing: 1px; color: var(--gray); }
        .btn-check { background: var(--success); border: none; height: 50px; padding: 0 20px; border-radius: 12px; font-weight: 700; color: #000; }
        
        /* NAV */
        .nav-bar { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); width: 94%; max-width: 450px; height: 80px; background: rgba(18, 22, 30, 0.98); backdrop-filter: blur(20px); display: flex; border-radius: 28px; border: 1px solid rgba(255,255,255,0.1); z-index: 100; }
        .nav-item { flex: 1; background: none; border: none; color: var(--gray); display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .nav-item.active { color: var(--primary); }
        .nav-item span { font-size: 26px; }

        .log-entry { border-left: 2px solid var(--primary); padding: 12px; margin-bottom: 15px; background: rgba(255,255,255,0.02); border-radius: 0 15px 15px 0; }
    </style>
</head>
<body>
<div class="app-container">
    <div class="main-content">
        <header class="header-profile">
            <div class="avatar-frame"><img id="display-avatar" src="https://via.placeholder.com/100/161b22/00f3ff?text=USER"></div>
            <div>
                <h1 id="greeting-text">Jogador</h1>
                <div style="font-size: 0.75rem; color: var(--primary); font-weight: 700" id="lvl-status">RANK 1</div>
            </div>
        </header>

        <div id="tab-status" class="tab-content active">
            <div class="progress-center">
                <div class="pie-chart" id="pie-chart"></div>
                <div class="pie-inner">
                    <span style="font-size:3rem; font-weight:700;" id="lvl-txt">1</span>
                    <span style="font-size:0.6rem; color:var(--primary); font-weight:700;">LVL</span>
                </div>
            </div>
            <div style="text-align:center; margin:12px 0; font-weight:700; font-size:0.9rem" id="xp-detail">0 / 200 XP</div>
            
            <h2 class="view-title">Constância Semanal</h2>
            <div class="weekly-grid" id="weekly-graph"></div>
        </div>

        <div id="tab-apex" class="tab-content">
            <h2 class="view-title">Objetivo Mestre</h2>
            <div id="apex-setup" class="card">
                <input type="text" id="apex-input" placeholder="O que define seu dia hoje?">
                <button class="btn-main" onclick="setApex()">ESTABELECER ALVO</button>
            </div>
            <div id="apex-active" class="card" style="display:none; text-align:center; border: 1px solid var(--primary)">
                <div style="font-size:1.4rem; font-weight:700; margin:25px 0" id="apex-display">---</div>
                <button class="btn-main" onclick="completeApex()">OBJETIVO ALCANÇADO</button>
            </div>
        </div>

        <div id="tab-side" class="tab-content">
            <h2 class="view-title">Lista de Missões</h2>
            <div id="unified-list"></div>
            
            <h2 class="view-title">Nova Missão Avulsa</h2>
            <div class="card">
                <input type="text" id="side-input" placeholder="Algo extra para fazer?">
                <button class="btn-main" style="height:55px" onclick="addSide()">ADICIONAR ⚡</button>
            </div>
        </div>

        <div id="tab-log" class="tab-content">
            <h2 class="view-title">Histórico de Logs</h2>
            <textarea id="log-input" rows="4" placeholder="O que você conquistou hoje?"></textarea>
            <button class="btn-main" onclick="addLog()">SALVAR RELATÓRIO</button>
            <div id="log-list" style="margin-top:20px"></div>
        </div>

        <div id="tab-sys" class="tab-content">
            <h2 class="view-title">Rotina Diária (Auto-Geração)</h2>
            <div class="card">
                <p style="font-size:0.7rem; color:var(--gray); margin-bottom:15px">Tarefas aqui reaparecem todo dia ao amanhecer.</p>
                <input type="text" id="routine-input" placeholder="Ex: Academia, Meditação, Estudo">
                <button class="btn-main" style="height:50px; font-size:1rem" onclick="addRoutine()">FIXAR NA ROTINA</button>
                <div id="routine-list" style="margin-top:15px"></div>
            </div>
            <h2 class="view-title">Dados do Perfil</h2>
            <div class="card">
                <input type="text" id="p-name" placeholder="Seu nome">
                <input type="text" id="p-img" placeholder="Link da imagem">
                <button class="btn-main" onclick="updateProfile()">SALVAR PERFIL</button>
            </div>
            <button class="btn-main" style="background:var(--success); color:#000; margin-bottom:12px" onclick="exportData()">EXPORTAR BACKUP</button>
            <button class="btn-main" style="background:var(--gray); color:#000" onclick="document.getElementById('f-in').click()">IMPORTAR BACKUP</button>
            <input type="file" id="f-in" style="display:none" onchange="importData(event)">
            <button class="btn-main" style="background:none; border:2px solid var(--danger); color:var(--danger); margin-top:30px" onclick="resetAll()">RESET TOTAL</button>
        </div>
    </div>

    <nav class="nav-bar">
        <button class="nav-item active" onclick="nav('tab-status', this)"><span>📊</span></button>
        <button class="nav-item" onclick="nav('tab-apex', this)"><span>⭐</span></button>
        <button class="nav-item" onclick="nav('tab-side', this)"><span>⚔️</span></button>
        <button class="nav-item" onclick="nav('tab-log', this)"><span>📜</span></button>
        <button class="nav-item" onclick="nav('tab-sys', this)"><span>⚙️</span></button>
    </nav>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('core_unity_v30')) || {
        xp: 0, playerName: "Jogador", playerImg: "",
        sideQuests: [], routine: [], logs: [], apexTask: "", apexStatus: "setup",
        lastLoginDate: "", weeklyHistory: [0,0,0,0,0,0,0]
    };

    const audio = new (window.AudioContext || window.webkitAudioContext)();
    function sound(f, d=0.1) {
        const o = audio.createOscillator(); const g = audio.createGain();
        o.frequency.value = f; g.gain.setValueAtTime(0.05, audio.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, audio.currentTime+d);
        o.connect(g); g.connect(audio.destination); o.start(); o.stop(audio.currentTime+d);
    }

    function save() { localStorage.setItem('core_unity_v30', JSON.stringify(db)); }

    function checkDailyReset() {
        const today = new Date().toLocaleDateString();
        if (db.lastLoginDate !== today) {
            db.routine.forEach(task => {
                if(!db.sideQuests.some(q => q.text === task)) {
                    db.sideQuests.push({ id: Date.now() + Math.random(), text: task, type: 'ROUTINE' });
                }
            });
            if(db.apexStatus === "done") { db.apexStatus = "setup"; db.apexTask = ""; }
            db.lastLoginDate = today; save();
        }
    }

    function render() {
        const lvl = Math.floor(db.xp / 200) + 1;
        const xpInLvl = db.xp % 200;
        const perc = (xpInLvl / 200) * 100;
        
        document.getElementById('lvl-txt').innerText = lvl;
        document.getElementById('lvl-status').innerText = `RANK ${lvl}`;
        document.getElementById('xp-detail').innerText = `${xpInLvl} / 200 XP`;
        document.getElementById('pie-chart').style.background = `conic-gradient(var(--primary) ${perc * 3.6}deg, rgba(255,255,255,0.05) 0deg)`;
        if(db.playerImg) document.getElementById('display-avatar').src = db.playerImg;
        document.getElementById('greeting-text').innerText = db.playerName;

        const todayIdx = new Date().getDay();
        document.getElementById('weekly-graph').innerHTML = db.weeklyHistory.map((val, i) => `
            <div class="day-bar ${i === todayIdx ? 'active' : ''}" style="height: ${Math.min(val/2, 50) + 5}px"></div>
        `).join('');

        document.getElementById('apex-setup').style.display = db.apexStatus === "setup" ? "block" : "none";
        document.getElementById('apex-active').style.display = db.apexStatus === "active" ? "block" : "none";
        document.getElementById('apex-display').innerText = db.apexTask;

        document.getElementById('unified-list').innerHTML = db.sideQuests.map(q => `
            <div class="quest-box ${q.type === 'ROUTINE' ? 'is-routine' : ''}">
                <div class="quest-info">
                    <span class="quest-tag">${q.type === 'ROUTINE' ? '♾️ DIÁRIA' : '⚡ EXTRA'}</span>
                    <span style="font-weight:700">${q.text}</span>
                </div>
                <button class="btn-check" onclick="completeQuest(${q.id})">OK</button>
            </div>`).join('');

        document.getElementById('routine-list').innerHTML = db.routine.map((t, i) => `
            <div style="display:flex; justify-content:space-between; padding:10px; background:rgba(255,255,255,0.03); margin-bottom:5px; border-radius:10px">
                <span style="font-size:0.9rem">${t}</span>
                <button style="color:var(--danger); background:none; border:none; font-weight:700" onclick="removeRoutine(${i})">X</button>
            </div>`).join('');

        document.getElementById('log-list').innerHTML = db.logs.map(l => `<div class="log-entry"><div style="font-size:0.65rem; color:var(--primary); font-weight:700">${l.date}</div><div style="font-size:0.95rem">${l.text}</div></div>`).join('');
    }

    function setApex() { 
        const v = document.getElementById('apex-input').value; if(!v) return;
        db.apexTask = v.toUpperCase(); db.apexStatus = "active"; sound(600); save(); render(); 
    }
    
    function completeApex() { 
        db.apexStatus = "done"; db.xp += 100;
        db.weeklyHistory[new Date().getDay()] += 100;
        sound(800); save(); render(); 
    }

    function addSide() { 
        const i = document.getElementById('side-input'); if(!i.value) return;
        db.sideQuests.push({ id: Date.now(), text: i.value.toUpperCase(), type: 'MANUAL' });
        i.value = ""; sound(500); save(); render(); 
    }

    function completeQuest(id) { 
        db.sideQuests = db.sideQuests.filter(x => x.id !== id);
        db.xp += 20; db.weeklyHistory[new Date().getDay()] += 20;
        sound(1000, 0.05); save(); render(); 
    }

    function addRoutine() {
        const i = document.getElementById('routine-input'); if(!i.value) return;
        db.routine.push(i.value.toUpperCase());
        db.sideQuests.push({ id: Date.now(), text: i.value.toUpperCase(), type: 'ROUTINE' });
        i.value = ""; save(); render();
    }

    function removeRoutine(idx) { db.routine.splice(idx, 1); save(); render(); }
    function addLog() {
        const i = document.getElementById('log-input'); if(!i.value) return;
        db.logs.unshift({ date: new Date().toLocaleString(), text: i.value });
        i.value = ""; save(); render();
    }

    function updateProfile() {
        db.playerName = document.getElementById('p-name').value || db.playerName;
        db.playerImg = document.getElementById('p-img').value || db.playerImg;
        save(); render(); alert("Perfil Atualizado!");
    }

    function nav(id, btn) {
        sound(400, 0.02);
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        btn.classList.add('active');
    }

    function exportData() {
        const b = new Blob([JSON.stringify(db)], {type:'application/json'});
        const a = document.createElement('a'); a.href = URL.createObjectURL(b);
        a.download = `backup_unity.json`; a.click();
    }

    function importData(e) {
        const f = e.target.files[0]; const r = new FileReader();
        r.onload = (ev) => { db = JSON.parse(ev.target.result); save(); render(); alert("Dados Sincronizados!"); };
        r.readAsText(f);
    }

    function resetAll() { if(confirm("CUIDADO: Apagar tudo permanentemente?")) { localStorage.clear(); location.reload(); } }
    
    checkDailyReset(); render();
</script>
</body>
</html>
