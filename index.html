<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SYSTEM - CUSTOM UNIVERSE</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&family=Space+Grotesk:wght@500;700&display=swap');
        :root { --bg: #0b0e14; --panel: rgba(22, 27, 34, 0.92); --primary: #00f3ff; --secondary: #7000ff; --text: #f0f4f8; --success: #00ffa3; --danger: #ff4d4d; --gray: #8b949e; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        
        body { 
            font-family: 'Outfit', sans-serif; 
            background-color: var(--bg);
            color: var(--text); margin: 0; padding: 0; overflow: hidden; height: 100vh; 
        }

        /* Plano de Fundo Dinâmico */
        #dynamic-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover; background-position: center;
            z-index: -2; transition: 0.5s;
        }

        .bg-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(11, 14, 20, 0.82); z-index: -1; backdrop-filter: blur(2px); }

        .app-container { display: flex; flex-direction: column; height: 100vh; max-width: 500px; margin: 0 auto; position: relative; }
        
        .tab-content { display: none; height: 100vh; overflow-y: auto; padding: 20px 20px 140px; animation: fadeIn 0.25s ease-out; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        /* Header & Streak */
        .header-profile { display: flex; align-items: center; gap: 15px; margin-bottom: 25px; margin-top: 10px; position: relative; }
        .avatar-frame { width: 65px; height: 65px; border-radius: 50%; border: 2px solid var(--primary); overflow: hidden; box-shadow: 0 0 15px rgba(0, 243, 255, 0.3); }
        .avatar-frame img { width: 100%; height: 100%; object-fit: cover; }
        #greeting-text { font-family: 'Space Grotesk', sans-serif; font-size: 1.2rem; font-weight: 700; margin: 0; color: #fff; }
        .streak-badge { position: absolute; right: 0; top: 10px; background: rgba(255, 68, 0, 0.2); border: 1px solid #ff4400; padding: 5px 12px; border-radius: 12px; font-weight: 700; color: #ffbb00; display: flex; align-items: center; gap: 5px; font-size: 0.8rem; }

        /* Progress Circle */
        .progress-circle { position: relative; width: 140px; height: 140px; margin: 10px auto; display: flex; justify-content: center; align-items: center; }
        .pie-chart { width: 100%; height: 100%; border-radius: 50%; background: conic-gradient(var(--primary) 0deg, rgba(255,255,255,0.05) 0deg); transition: 1s; }
        .pie-inner { position: absolute; width: 115px; height: 115px; background: rgba(11, 14, 20, 0.9); border-radius: 50%; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        
        .weekly-grid { display: flex; justify-content: space-between; align-items: flex-end; height: 60px; margin: 20px 0; padding: 10px; background: rgba(255,255,255,0.05); border-radius: 18px; }
        .day-bar { width: 10px; background: rgba(255,255,255,0.1); border-radius: 5px; min-height: 4px; }
        .day-bar.active { background: var(--primary); box-shadow: 0 0 10px var(--primary); }

        /* UI Elements */
        .card { background: var(--panel); padding: 22px; border-radius: 28px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.08); backdrop-filter: blur(10px); }
        .view-title { font-family: 'Space Grotesk', sans-serif; font-size: 0.8rem; margin: 25px 0 12px; color: var(--gray); text-transform: uppercase; letter-spacing: 2px; border-left: 4px solid var(--primary); padding-left: 12px; }
        .btn-main { width: 100%; height: 65px; border-radius: 20px; border: none; background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #fff; font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: 0.2s; }
        input, textarea { width: 100%; padding: 18px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); color: #fff; border-radius: 18px; margin-bottom: 12px; font-size: 1rem; }
        
        /* Unified Quest List */
        .quest-item { background: rgba(255,255,255,0.05); padding: 16px; border-radius: 22px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-left: 4px solid var(--secondary); }
        .quest-item.is-routine { border-left-color: var(--primary); }
        .btn-check { background: var(--success); border: none; height: 48px; padding: 0 20px; border-radius: 12px; font-weight: 700; color: #000; }
        
        /* Navbar */
        .nav-bar { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 450px; height: 80px; background: rgba(15, 18, 25, 0.98); display: flex; border-radius: 30px; border: 1px solid rgba(255,255,255,0.1); z-index: 999; }
        .nav-item { flex: 1; background: none; border: none; color: var(--gray); display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .nav-item.active { color: var(--primary); }
        .nav-item span { font-size: 24px; }
    </style>
</head>
<body>
<div id="dynamic-bg"></div>
<div class="bg-overlay"></div>
<div style="display:none"><div id="player"></div></div>

<div class="app-container">
    
    <div id="tab-status" class="tab-content active">
        <header class="header-profile">
            <div class="avatar-frame"><img id="display-avatar" src="https://via.placeholder.com/100/161b22/00f3ff?text=USER"></div>
            <div>
                <h1 id="greeting-text">Olá...</h1>
                <div id="motivational-quote" style="font-size:0.8rem; color:var(--primary); font-style:italic">Prepare-se.</div>
            </div>
            <div class="streak-badge">🔥 <span id="streak-count">0</span> DIAS</div>
        </header>
        <div class="progress-circle">
            <div class="pie-chart" id="pie-chart"></div>
            <div class="pie-inner"><span style="font-size:3rem; font-weight:700;" id="lvl-txt">1</span><span style="font-size:0.6rem; color:var(--primary); font-weight:700;">RANK</span></div>
        </div>
        <div style="text-align:center; margin:15px 0; font-weight:700" id="xp-detail">0 / 200 XP</div>
        <h2 class="view-title">Desempenho Semanal</h2>
        <div class="weekly-grid" id="weekly-graph"></div>
    </div>

    <div id="tab-apex" class="tab-content">
        <h2 class="view-title">Objetivo Mestre (Apex)</h2>
        <div id="apex-setup" class="card">
            <input type="text" id="apex-input" placeholder="O que define seu sucesso hoje?">
            <button class="btn-main" onclick="setApex()">ATIVAR PROTOCOLO</button>
        </div>
        <div id="apex-active" class="card" style="display:none; text-align:center; border: 1px solid var(--primary)">
            <div style="font-size:1.5rem; font-weight:700; margin:30px 0; color:#fff" id="apex-display">---</div>
            <button class="btn-main" onclick="completeApex()">MISSÃO CONCLUÍDA</button>
        </div>
    </div>

    <div id="tab-missions" class="tab-content">
        <h2 class="view-title">Quadro de Missões</h2>
        <div id="unified-list"></div>
        <h2 class="view-title">Adicionar Side Quest</h2>
        <div class="card">
            <input type="text" id="side-input" placeholder="Tarefa extra...">
            <button class="btn-main" style="height:55px" onclick="addSide()">ADICIONAR ⚡</button>
        </div>
    </div>

    <div id="tab-log" class="tab-content">
        <h2 class="view-title">Arquivos de Campanha</h2>
        <textarea id="log-input" rows="4" placeholder="Relate suas vitórias de hoje..."></textarea>
        <button class="btn-main" onclick="addLog()">SALVAR LOG</button>
        <div id="log-list" style="margin-top:20px"></div>
    </div>

    <div id="tab-sys" class="tab-content">
        <h2 class="view-title">Aparência & Atmosfera</h2>
        <div class="card">
            <p style="font-size:0.75rem; color:var(--gray)">URL do Plano de Fundo:</p>
            <input type="text" id="bg-url" placeholder="Link da imagem (Ex: Imgur, Pinterest)">
            <button class="btn-main" style="height:50px; font-size:1rem; margin-bottom:15px" onclick="updateBg()">APLICAR FUNDO</button>
            
            <p style="font-size:0.75rem; color:var(--gray)">ID de Música (YouTube):</p>
            <input type="text" id="yt-url" placeholder="Ex: dQw4w9WgXcQ">
            <button class="btn-main" style="height:50px; font-size:1rem" onclick="updateMusic()">SOLTAR O SOM 🎵</button>
        </div>

        <h2 class="view-title">Configurar Diárias</h2>
        <div class="card">
            <input type="text" id="routine-input" placeholder="Tarefa recorrente">
            <button class="btn-main" style="height:50px; font-size:1rem" onclick="addRoutine()">FIXAR NA ROTINA</button>
            <div id="routine-list" style="margin-top:15px"></div>
        </div>

        <h2 class="view-title">Perfil & Dados</h2>
        <div class="card">
            <input type="text" id="p-name" placeholder="Seu Nome">
            <input type="text" id="p-img" placeholder="Link do Avatar">
            <button class="btn-main" onclick="updateProfile()">ATUALIZAR PERFIL</button>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px">
            <button class="btn-main" style="background:var(--success); color:#000; height:50px; font-size:0.9rem" onclick="exportData()">EXPORTAR</button>
            <button class="btn-main" style="background:var(--gray); color:#000; height:50px; font-size:0.9rem" onclick="document.getElementById('f-in').click()">IMPORTAR</button>
        </div>
        <input type="file" id="f-in" style="display:none" onchange="importData(event)">
        <button class="btn-main" style="background:none; border:2px solid var(--danger); color:var(--danger); margin-top:30px; height:45px" onclick="resetAll()">RESET TOTAL</button>
    </div>

    <nav class="nav-bar">
        <button class="nav-item active" onclick="nav('tab-status', this)"><span>📊</span></button>
        <button class="nav-item" onclick="nav('tab-apex', this)"><span>⭐</span></button>
        <button class="nav-item" onclick="nav('tab-missions', this)"><span>⚔️</span></button>
        <button class="nav-item" onclick="nav('tab-log', this)"><span>📜</span></button>
        <button class="nav-item" onclick="nav('tab-sys', this)"><span>⚙️</span></button>
    </nav>
</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
    const quotes = ["A vitória é uma decisão diária.", "O sistema reconhece seu esforço.", "Mantenha a guarda alta.", "Execute o plano com perfeição."];
    let player;

    let db = JSON.parse(localStorage.getItem('custom_universe_v34')) || {
        xp: 0, playerName: "Jogador", playerImg: "", streak: 0, bgImg: "https://images.unsplash.com/photo-1614850523296-d8c1af93d400?q=80&w=2070",
        sideQuests: [], routine: [], logs: [], apexTask: "", apexStatus: "setup",
        lastLoginDate: "", weeklyHistory: [0,0,0,0,0,0,0], ytId: ""
    };

    function onYouTubeIframeAPIReady() {
        player = new YT.Player('player', {
            height: '0', width: '0', videoId: db.ytId || '',
            events: { 'onReady': (e) => e.target.playVideo() }
        });
    }

    const audio = new (window.AudioContext || window.webkitAudioContext)();
    function sound(f, d=0.1) {
        const o = audio.createOscillator(); const g = audio.createGain();
        o.frequency.value = f; g.gain.setValueAtTime(0.04, audio.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, audio.currentTime+d);
        o.connect(g); g.connect(audio.destination); o.start(); o.stop(audio.currentTime+d);
    }

    function save() { localStorage.setItem('custom_universe_v34', JSON.stringify(db)); }

    function checkDailyReset() {
        const today = new Date().toLocaleDateString();
        if (db.lastLoginDate !== today) {
            if (db.apexStatus !== "done" && db.lastLoginDate !== "") db.streak = 0;
            db.routine.forEach(task => {
                if(!db.sideQuests.some(q => q.text === task)) {
                    db.sideQuests.push({ id: Date.now() + Math.random(), text: task, type: 'ROUTINE' });
                }
            });
            if(db.apexStatus === "done") { db.apexStatus = "setup"; db.apexTask = ""; }
            db.lastLoginDate = today; save();
        }
    }

    function render() {
        const lvl = Math.floor(db.xp / 200) + 1;
        const xpInLvl = db.xp % 200;
        const perc = (xpInLvl / 200) * 100;
        
        document.getElementById('lvl-txt').innerText = lvl;
        document.getElementById('xp-detail').innerText = `${xpInLvl} / 200 XP`;
        document.getElementById('pie-chart').style.background = `conic-gradient(var(--primary) ${perc * 3.6}deg, rgba(255,255,255,0.05) 0deg)`;
        if(db.playerImg) document.getElementById('display-avatar').src = db.playerImg;
        document.getElementById('greeting-text').innerText = `Olá, ${db.playerName}`;
        document.getElementById('motivational-quote').innerText = quotes[Math.floor(Math.random() * quotes.length)];
        document.getElementById('streak-count').innerText = db.streak;
        document.getElementById('dynamic-bg').style.backgroundImage = `url('${db.bgImg}')`;

        const todayIdx = new Date().getDay();
        document.getElementById('weekly-graph').innerHTML = db.weeklyHistory.map((val, i) => `
            <div class="day-bar ${i === todayIdx ? 'active' : ''}" style="height: ${Math.min(val/2.5, 50) + 4}px"></div>
        `).join('');

        document.getElementById('apex-setup').style.display = db.apexStatus === "setup" ? "block" : "none";
        document.getElementById('apex-active').style.display = db.apexStatus === "active" ? "block" : "none";
        document.getElementById('apex-display').innerText = db.apexTask;

        document.getElementById('unified-list').innerHTML = db.sideQuests.map(q => `
            <div class="quest-item ${q.type === 'ROUTINE' ? 'is-routine' : ''}">
                <div>
                    <div style="font-size:0.55rem; color:var(--gray); font-weight:800">${q.type === 'ROUTINE' ? '♾️ ROTINA' : '⚡ EXTRA'}</div>
                    <div style="font-weight:700">${q.text}</div>
                </div>
                <button class="btn-check" onclick="completeQuest(${q.id})">OK</button>
            </div>`).join('');

        document.getElementById('routine-list').innerHTML = db.routine.map((t, i) => `
            <div style="display:flex; justify-content:space-between; padding:10px; background:rgba(255,255,255,0.03); margin-bottom:5px; border-radius:10px">
                <span style="font-size:0.85rem">${t}</span>
                <button style="color:var(--danger); background:none; border:none; font-weight:700" onclick="removeRoutine(${i})">X</button>
            </div>`).join('');

        document.getElementById('log-list').innerHTML = db.logs.map(l => `<div style="border-left:2px solid var(--primary); padding:10px; margin-bottom:10px; background:rgba(255,255,255,0.02)">
            <div style="font-size:0.6rem; color:var(--primary)">${l.date}</div><div>${l.text}</div></div>`).join('');
    }

    function setApex() { 
        const v = document.getElementById('apex-input').value; if(!v) return;
        db.apexTask = v.toUpperCase(); db.apexStatus = "active"; sound(600); save(); render(); 
    }
    
    function completeApex() { 
        db.apexStatus = "done"; db.xp += 100; db.streak++;
        db.weeklyHistory[new Date().getDay()] += 100;
        sound(800); save(); render(); 
    }

    function addSide() { 
        const i = document.getElementById('side-input'); if(!i.value) return;
        db.sideQuests.push({ id: Date.now(), text: i.value.toUpperCase(), type: 'MANUAL' });
        i.value = ""; sound(500); save(); render(); 
    }

    function completeQuest(id) { 
        db.sideQuests = db.sideQuests.filter(x => x.id !== id);
        db.xp += 20; db.weeklyHistory[new Date().getDay()] += 20;
        sound(1000, 0.05); save(); render(); 
    }

    function addRoutine() {
        const i = document.getElementById('routine-input'); if(!i.value) return;
        db.routine.push(i.value.toUpperCase());
        db.sideQuests.push({ id: Date.now(), text: i.value.toUpperCase(), type: 'ROUTINE' });
        i.value = ""; save(); render();
    }

    function removeRoutine(idx) { db.routine.splice(idx, 1); save(); render(); }
    function addLog() {
        const i = document.getElementById('log-input'); if(!i.value) return;
        db.logs.unshift({ date: new Date().toLocaleString(), text: i.value });
        i.value = ""; save(); render();
    }

    function updateProfile() {
        db.playerName = document.getElementById('p-name').value || db.playerName;
        db.playerImg = document.getElementById('p-img').value || db.playerImg;
        save(); render(); alert("Sincronizado!");
    }

    function updateBg() {
        const url = document.getElementById('bg-url').value;
        if(url) { db.bgImg = url; save(); render(); }
    }

    function updateMusic() {
        const id = document.getElementById('yt-url').value;
        if(id) { db.ytId = id; save(); player.loadVideoById(id); }
    }

    function nav(id, btn) {
        sound(400, 0.02);
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        btn.classList.add('active');
    }

    function exportData() {
        const b = new Blob([JSON.stringify(db)], {type:'application/json'});
        const a = document.createElement('a'); a.href = URL.createObjectURL(b);
        a.download = `hero_backup_v34.json`; a.click();
    }

    function importData(e) {
        const f = e.target.files[0]; const r = new FileReader();
        r.onload = (ev) => { db = JSON.parse(ev.target.result); save(); render(); location.reload(); };
        r.readAsText(f);
    }

    function resetAll() { if(confirm("Apagar tudo?")) { localStorage.clear(); location.reload(); } }
    
    checkDailyReset(); render();
</script>
</body>
</html>
